amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 5000  # 增加粒子数（从2000），支持全局定位
    min_particles: 1000  # 增加最小粒子（从500）
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1  # 启用快速恢复（从0.0），帮助丢失后重新定位
    recovery_alpha_slow: 0.001  # 启用慢速恢复（从0.0）
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.5  # 1.5秒容差（折中值，容忍实际系统延迟）
    update_min_a: 0.15  # 降低角度阈值（从0.2），更频繁更新
    update_min_d: 0.2   # 降低距离阈值（从0.25）
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true  # 需要初始位姿
    always_reset_initial_pose: false  # 不每次重置，保持定位连续性

